<!doctype html>
<html lang="en" class="bg-[#050505] text-zinc-100">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeonPulse - Underground Punk Rock Lineup & Digital Passes</title>
  
  <!-- Prevent Flash of Unstyled Content (FOUC) -->
  <style>
    html, body {
      background-color: #050505;
      color: #f4f4f5;
    }
  </style>
  <link rel="stylesheet" href="/src/styles/global.css" />
</head>

<body class="px-4 py-5 md:px-8 md:py-6 max-w-7xl mx-auto">
  <div id="app">
    <!-- Header with High-Contrast Cyberpunk Branding & Auth Bar -->
    <header class="flex flex-col md:flex-row md:items-center justify-between pb-5 mb-6 border-b border-zinc-800 gap-4">
      <a id="brand-home-link" href="#" class="cursor-pointer group block text-left no-underline" title="Home">
        <div class="inline-flex items-center gap-2 px-2.5 py-0.5 mb-1.5 rounded bg-red-950/80 border border-red-800 text-red-400 text-[11px] font-black uppercase tracking-widest">
          <span id="header-category-text">⚡ PUNK ROCK & LIVE SESSIONS</span>
        </div>
        <h1 class="text-3xl md:text-5xl font-black uppercase tracking-tighter text-white leading-none group-hover:text-red-500 transition-colors">
          NEON<span class="text-red-600 group-hover:text-white transition-colors">PULSE</span>
        </h1>
        <p id="header-tagline-text" class="text-zinc-400 text-xs md:text-sm font-medium tracking-wide mt-1">
          Official Underground Gig Lineup & Digital Ticket Vault
        </p>
      </a>

      <!-- Navigation & Auth Controls -->
      <div id="contenedor-auth-header" class="flex flex-wrap items-center gap-3"></div>
    </header>

    <main id="app-main-content">
      <!-- 1. Lineup View Container -->
      <div id="view-lineup" class="space-y-6">
        <!-- Featured Gig Banner -->
        <div id="contenedor-destacado">
          <div class="w-full h-48 md:h-64 mb-6 rounded-xl bg-zinc-900 border border-zinc-800 animate-pulse flex flex-col justify-end p-6 gap-3">
            <div class="h-4 w-32 bg-zinc-800 rounded"></div>
            <div class="h-8 w-3/4 md:w-1/2 bg-zinc-800 rounded"></div>
            <div class="h-4 w-1/3 bg-zinc-800 rounded"></div>
          </div>
        </div>

        <!-- Section Title & Counter -->
        <div class="flex items-center justify-between pt-2">
          <h2 class="text-lg md:text-xl font-black uppercase tracking-wider text-white flex items-center gap-2">
            <span class="w-2 h-5 bg-red-600 rounded-xs inline-block"></span>
            <span id="lineup-title-text">Concert Lineup</span>
          </h2>
          <span id="contador-fechas" class="text-[11px] font-extrabold uppercase tracking-wider text-zinc-300 bg-zinc-900 px-3 py-1 rounded border border-zinc-800 inline-flex items-center gap-1.5">
            <svg class="animate-spin h-3 w-3 text-red-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Loading gigs...</span>
          </span>
        </div>

        <!-- Concerts Grid -->
        <div id="contenedor-cartelera" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 items-stretch">
          <div class="h-72 rounded-xl bg-zinc-900 border border-zinc-800 animate-pulse p-4 flex flex-col justify-between">
            <div class="h-32 w-full bg-zinc-800 rounded-lg mb-3"></div>
            <div class="space-y-2">
              <div class="h-5 w-3/4 bg-zinc-800 rounded"></div>
              <div class="h-4 w-1/2 bg-zinc-800 rounded"></div>
            </div>
            <div class="h-8 w-full bg-zinc-800 rounded mt-3"></div>
          </div>
        </div>

      </div>

      <!-- 2. Concert Detail Page Container -->
      <div id="view-detail" class="hidden"></div>

      <!-- 3. User Profile View Container -->
      <div id="view-profile" class="hidden"></div>

      <!-- 4. Admin Management View Container -->
      <div id="view-admin" class="hidden"></div>

      <!-- 5. Admin Concert Editor View Container -->
      <div id="view-admin-editor" class="hidden"></div>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
